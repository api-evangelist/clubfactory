name: Club Factory
description: Club Factory was a Chinese-owned cross-border e-commerce marketplace app
  that grew to roughly 70 million users globally, with India its largest market at
  around 40 million users. In June 2020 the Government of India banned Club Factory
  alongside 58 other Chinese apps citing data and privacy concerns, and the company
  withdrew from the Indian market shortly after. It was originally added to the API
  Evangelist network as a stub lead surfaced from Qiming's portfolio. Enrichment finds
  the company effectively defunct - clubfactory.com no longer serves a company site
  (it is parked for sale via Afternic nameservers and redirects to a /lander page),
  there is no live developer or API surface, no published SDKs, and no discoverable
  /.well-known documents.
